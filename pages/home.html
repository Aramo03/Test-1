<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayfrane</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <header>
        <div class="logo">
            <h1>Dayfrane</h1>
        </div>

        <nav>
            <ul class="navigation">
                <li class="li-nav"><a href="" class="nav">Home</a></li>
                <li class="li-nav"><a href="" class="nav">Movies</a></li>
                <li class="li-nav"><a href="" class="nav">Tramsis</a></li>
                <li class="li-nav"><a href="" class="nav">Comments</a></li>
            </ul>
        </nav>

        <div class="buttons">
            <button class="log-in">Log in</button>
            <button class="sing-us">Sing Us</button>
        </div>

    </header>

    <main>

        <section class="baner-hero">
            <div class="camera"></div>
            <h1>YOUR LIFE. <br> ONE CALENDAR</h1>
            <p>Movies, Matches, Trips. Everything wort remembering.</p>
            <button>VIEW CALENDAR</button>
        </section>


        <section class="bottom-sect">

            <div class="day">
                <h1>TODAY</h1>
            </div>

            <div class="all-card">

                <div class="card movie">
                    <div class="poster"></div>
                    <h3>NEON HORIZON</h3>
                    <h2>8:00 PM</h2>
                    <p>Cinema 1</p>
                    <div class="red"></div>
                </div>


                <div class="card football">
                    <div class="match">
                        <div class="arsenal"></div>
                        <h1 class="vs">VS</h1>
                        <div class="chelsea"></div>
                    </div>

                    <div class="football-text">
                        <h1>6:00 PM</h1>
                        <p>Premier Leauge</p>
                        <button>live</button>
                        <div class="blue"></div>
                    </div>

                </div>

                <div class="card itali">
                    <div class="none-italy">
                        <div class="italy-card"></div>
                    </div>
                    <div class="green"></div>
                    <div class="italy-text">
                        <h2>FLIGHT AB123</h2>
                        <h1>10:45 AM</h1>
                        <p>Roma</p>
                    </div>
                </div>

            </div>

        </section>

    </main>


</body>

</html>
